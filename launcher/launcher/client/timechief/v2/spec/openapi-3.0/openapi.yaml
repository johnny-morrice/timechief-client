openapi: "3.0.0"
info:
  version: "1.0.0"
  title: "Timechief API"
servers:
  - url: "https://api.timechief.com/api/v2"

security:
  - bearerAuth: []

paths:
  /auth0/logout:
    post:
      operationId: "logoutWebSession"
      summary: "Clear web session data"
      responses:
        "200":
          description: "Follow returned URL for browser logout"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutRedirect"
        "500":
          description: "Internal server error"
  /device:
    post:
      summary: "Create a new device"
      operationId: "createDevice"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Device"
      responses:
        "200":
          description: "Device created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"
    put:
      summary: "Update device"
      operationId: "updateDevice"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Device"
      responses:
        "204":
          description: "Device updated successfully"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

    get:
      summary: "Get a list of devices"
      operationId: "listDevices"
      parameters:
        - in: "query"
          name: "limit"
          description: "Number of devices to return"
          required: true
          schema:
            type: "integer"
        - in: "query"
          name: "offset"
          description: "Offset for paginated results"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "List of devices retrieved successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Device"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

  /device/{id}:
    get:
      summary: "Get a device by ID"
      operationId: "getDeviceById"
      parameters:
        - in: "path"
          name: "id"
          description: "ID of the device to retrieve"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Device retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

  /apikey:
