    get:
      summary: "Get a list of versions"
      operationId: "listVersions"
      parameters:
        - in: "query"
          name: "limit"
          description: "Number of versions to return"
          required: true
          schema:
            type: "integer"
        - in: "query"
          name: "offset"
          description: "Offset for paginated results"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "List of versions retrieved successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Version"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

  /version/{id}:
    get:
      summary: "Get a version by ID"
      operationId: "getVersionById"
      parameters:
        - in: "path"
          name: "id"
          description: "ID of the version to retrieve"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Version retrieved successfully"
