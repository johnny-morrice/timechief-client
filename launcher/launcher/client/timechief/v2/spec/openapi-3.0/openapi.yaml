          description: "Internal server error"

    put:
      summary: "Update an order"
      operationId: "updateOrder"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "204":
          description: "Order updated successfully"
        "400":
          description: "Bad request - Invalid input"
        "500":
