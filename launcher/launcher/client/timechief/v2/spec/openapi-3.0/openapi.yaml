          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"
    put:
      summary: "Update a new license"
      operationId: "updateLicense"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/License"
      responses:
        "204":
          description: "License updated successfully"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"
    get:
      summary: "Get a list of licenses"
      operationId: "listLicenses"
      parameters:
        - in: "query"
          name: "limit"
          description: "Number of licenses to return"
          required: true
          schema:
            type: "integer"
        - in: "query"
          name: "offset"
          description: "Offset for paginated results"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "List of licenses retrieved successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/License"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

  /license/{id}:
    get:
      summary: "Get a license by ID"
      operationId: "getLicenseById"
      parameters:
        - in: "path"
          name: "id"
          description: "ID of the license to retrieve"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "License retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

  /principal:
    post:
      summary: "Create a new principal"
      operationId: "createPrincipal"
      requestBody:
        required: true
