          description: "Internal server error"

  /world/geocode:
    get:
      summary: "Geocode a location"
      operationId: "geocode"
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: string
            format: latitude
        - name: lng
          in: query
          required: true
          schema:
            type: string
            format: longitude
        - name: term
          in: query
          required: true
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeResult"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /theme:
    post:
      summary: "Create a new theme"
      operationId: "createTheme"
      requestBody:
        required: true
        content:
