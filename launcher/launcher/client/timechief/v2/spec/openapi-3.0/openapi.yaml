        - lng
        - timezone
        - address
        - location
        - culture
      properties:
        lat:
          type: string
        lng:
          type: string
        timezone:
          type: string
        address:
          type: string
        location:
          type: string
        culture:
          type: object
          required:
            - country_code
            - default_locale
            - default_temperature_option
            - default_hour_cycle_option
          properties:
            country_code:
              type: string
            default_locale:
              type: string
            default_temperature_option:
              type: string
            default_hour_cycle_option:
              type: string

    APIKey:
      type: object
      required:
        - uuid
        - principal_uuid
        - name
        - scopes
        - is_admin
      properties:
        uuid:
          type: string
        name:
          type: string
        is_admin:
          type: boolean
        principal_uuid:
          type: string
        scopes:
          type: array
          items:
            type: string
    Device:
      type: "object"
      required:
        - uuid
        - nickname
        - latitude
        - longitude
        - timezone
        - location
        - locale
        - hour_cycle_option
        - temperature_option
        - license_uuid
        - is_muted
