  /version/{id}/download:
    get:
      summary: "Get a version download by ID"
      operationId: "getVersionDownloadById"
      parameters:
        - in: "path"
          name: "id"
          description: "ID of the version to retrieve"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Version download retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionDownload"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

  /version/latest/{product}/{stream}:
    get:
      summary: "Get latest versions"
      operationId: "listLatestVersions"
      parameters:
        - in: "path"
          name: "product"
          description: "Version product"
          required: true
          schema:
            type: "string"
        - in: "path"
          name: "stream"
          description: "Version stream"
          required: true
          schema:
            type: "string"
        - in: "query"
          name: "include_non_live_versions"
          description: "Include non-live versions"
          required: false
          schema:
            type: "boolean"
      responses:
        "200":
          description: "List of versions retrieved successfully"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Version"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

  /googleprofile:
