      summary: "Get a principal google account by principal UUID"
      operationId: "getPrincipalGoogleAccountByPrincipalUUID"
      parameters:
        - in: "path"
          name: "principal_uuid"
          description: "Principal UUID of the principal google account to retrieve"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Principal google account retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalGoogleAccount"
        "400":
          description: "Bad request - Invalid input"
        "401":
          description: "Unauthorized - Invalid or missing access token"
        "500":
          description: "Internal server error"

  /googleprofile/me:
    get:
      summary: "Get the principal google account for the current user"
      operationId: "getMyPrincipalGoogleAccount"
      responses:
